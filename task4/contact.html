<h1>Contact</h1>
<p class="lead">Send me a message. All fields are required.</p>
<form id="contactForm" class="card" style="max-width:560px" novalidate>
<div class="field"><label for="name">Name</label><input id="name" autocomplete="name"><div class="err" id="nameErr"></div></div>
<div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email"><div class="err" id="emailErr"></div></div>
<div class="field"><label for="message">Message</label><textarea id="message" rows="5"></textarea><div class="err" id="messageErr"></div></div>
<button class="btn" type="submit">Send message</button>
<div class="ok" id="ok" role="status">Message sent. Thanks for reaching out!</div>
</form>
