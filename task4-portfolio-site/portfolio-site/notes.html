<h1>Notes</h1>
<p class="lead">Notes are saved in your browser, so they are still here after a refresh.</p>
<form id="noteForm" class="card" novalidate>
<div class="notes-top"><div class="field"><label for="title">Title</label><input id="title" maxlength="60"></div>
<div class="field"><label for="search">Search notes</label><input id="search" type="search" placeholder="Type to filter"></div></div>
<div class="field"><label for="body">Note</label><textarea id="body" rows="4"></textarea></div>
<button class="btn" id="saveBtn" type="submit">Save note</button> <span class="err" id="msg" role="alert"></span>
</form>
<p class="muted" id="count" style="margin:20px 0 10px"></p>
